<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ホーム画面用アイコン。中心から半径205px（80%）の中に収め、丸く切り抜かれても欠けないようにする -->
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#cfe3d4" stroke-width="2"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#f6faf4"/>
  <rect width="512" height="512" fill="url(#grid)"/>

  <!-- 台 -->
  <rect x="226" y="408" width="60" height="70" fill="#4a392c"/>
  <rect x="136" y="384" width="240" height="30" rx="7" fill="#5b4636"/>
  <rect x="136" y="384" width="240" height="8" fill="#7a5f49"/>

  <!-- 林（下）：ゲームと同じく枠なしの字そのもの -->
  <text x="256" y="336" font-family="Noto Serif CJK JP" font-weight="900" font-size="112" text-anchor="middle" dominant-baseline="central"
        fill="#e5735f" stroke="#1d2321" stroke-width="8" stroke-linejoin="round" paint-order="stroke">林</text>

  <!-- 森（上、合体できる金色に光る） -->
  <g transform="rotate(-7 250 200)">
    <text x="250" y="200" font-family="Noto Serif CJK JP" font-weight="900" font-size="150" text-anchor="middle" dominant-baseline="central"
          fill="none" stroke="#ffc93c" stroke-width="22" stroke-linejoin="round" filter="url(#glow)">森</text>
    <text x="250" y="200" font-family="Noto Serif CJK JP" font-weight="900" font-size="150" text-anchor="middle" dominant-baseline="central"
          fill="#f0b429" stroke="#1d2321" stroke-width="9" stroke-linejoin="round" paint-order="stroke">森</text>
  </g>

  <!-- 合体のはんこ -->
  <g transform="rotate(10 352 138)">
    <rect x="316" y="102" width="72" height="72" rx="10" fill="#e2412b"/>
    <rect x="322" y="108" width="60" height="60" rx="6" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="3"/>
    <text x="352" y="139" font-family="Noto Sans CJK JP" font-weight="900" font-size="48" text-anchor="middle" dominant-baseline="central" fill="#fff">合</text>
  </g>
</svg>
