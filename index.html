<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6faf4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="漢字タワー" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="description" content="漢字を積んで、くっつけて、新しい字を作る物理パズル。ひとりでも、部屋番号でみんなと対戦も。" />
    <meta property="og:title" content="合体！漢字タワー" />
    <meta property="og:description" content="漢字を積んで、くっつけて、新しい字を作る物理パズル。" />
    <meta property="og:type" content="website" />
    <title>合体！漢字タワー</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%23e2412b'/><text x='50' y='72' font-size='64' text-anchor='middle' fill='white' font-family='serif' font-weight='700'>林</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="app">
      <!-- タイトル -->
      <section id="title" class="screen active">
        <div class="logo">
          <span class="stamp">合体！</span>
          <h1>漢字<br />タワー</h1>
        </div>
        <p class="lead">漢字を積んで、くっつけて、<br />新しい字を作ろう。</p>
        <div class="modes" id="mode-pick" role="radiogroup" aria-label="難易度"></div>
        <p id="mode-desc" class="mode-desc"></p>
        <div class="menu">
          <button id="btn-solo" class="btn primary">ひとりで遊ぶ</button>
          <button id="btn-battle" class="btn ink">みんなで対戦</button>
          <div class="row">
            <button id="btn-dex" class="btn">図鑑</button>
            <button id="btn-rank" class="btn">ランキング</button>
          </div>
        </div>
        <button id="btn-sound" class="sound" aria-label="音のオン・オフ">音：オン</button>
        <footer class="credit">中濱Games</footer>
      </section>

      <!-- ゲーム -->
      <section id="play" class="screen">
        <header class="hud">
          <button id="btn-quit" class="icon" aria-label="やめる">✕</button>
          <div class="stats">
            <div><b id="s-strokes">0</b><small>総画数</small></div>
            <div><b id="s-height">0.0</b><small>高さ m</small></div>
            <div><b id="s-count">0</b><small>字数</small></div>
          </div>
          <div id="timer" class="timer" hidden>90</div>
          <button id="btn-pause" class="icon" aria-label="一時停止">Ⅱ</button>
        </header>
        <div id="rivals" class="rivals" hidden></div>
        <div class="board">
          <canvas id="canvas"></canvas>
          <button id="btn-rotate" class="rotate" aria-label="回転">↻ 回転</button>
          <div id="banner" class="banner" hidden></div>
        </div>
        <nav id="tray" class="tray" aria-label="次に落とす字"></nav>
      </section>
    </main>

    <!-- 結果 -->
    <dialog id="dlg-result">
      <h2 id="r-title">記録</h2>
      <div id="r-battle"></div>
      <canvas id="r-image" width="1200" height="630"></canvas>
      <div class="r-scores" id="r-scores"></div>
      <p id="r-made" class="made"></p>
      <form id="r-submit" class="submit">
        <input id="r-name" maxlength="12" placeholder="名前（12文字まで）" autocomplete="nickname" />
        <button class="btn ink" type="submit">ランキングに登録</button>
      </form>
      <p id="r-msg" class="msg" role="status"></p>
      <div class="row">
        <button id="r-save" class="btn">画像を保存</button>
        <button id="r-share" class="btn">Xでシェア</button>
      </div>
      <div class="row">
        <button id="r-again" class="btn primary">もう一度</button>
        <button id="r-home" class="btn">タイトルへ</button>
      </div>
    </dialog>

    <!-- 図鑑 -->
    <dialog id="dlg-dex" class="sheet">
      <header class="sheet-head">
        <h2>図鑑 <small id="dex-count"></small></h2>
        <button class="icon close" aria-label="閉じる">✕</button>
      </header>
      <div id="dex-detail" class="dex-detail"></div>
      <div id="dex-grid" class="dex-grid"></div>
    </dialog>

    <!-- ランキング -->
    <dialog id="dlg-rank" class="sheet">
      <header class="sheet-head">
        <h2>ランキング</h2>
        <button class="icon close" aria-label="閉じる">✕</button>
      </header>
      <div class="tabs modes-tabs" id="rank-modes" role="tablist" aria-label="難易度"></div>
      <div class="tabs" id="rank-tabs" role="tablist" aria-label="種目"></div>
      <div id="rank-mine" class="mine"></div>
      <ol id="rank-list" class="rank-list"></ol>
      <p id="rank-msg" class="msg"></p>
    </dialog>

    <!-- 対戦の部屋 -->
    <dialog id="dlg-room" class="sheet">
      <header class="sheet-head">
        <h2>みんなで対戦</h2>
        <button class="icon close" aria-label="閉じる">✕</button>
      </header>
      <div id="room-entry">
        <p class="rule">同じ字が同じ順で出ます。<b>90秒</b>で一番多く画数を積んだ人の勝ち。何人でも参加できます（50人まで）。塔から字が落ちたら、その時点の記録で終わりです。</p>
        <label class="field">名前<input id="room-name" maxlength="12" placeholder="名前" autocomplete="nickname" /></label>
        <button id="room-create" class="btn primary">部屋を作る</button>
        <form id="room-join" class="join">
          <input id="room-code" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="部屋番号 4桁" />
          <button class="btn ink" type="submit">参加する</button>
        </form>
      </div>
      <div id="room-lobby" hidden>
        <p class="code-label">部屋番号</p>
        <div id="room-tiles" class="tiles" aria-label="部屋番号"></div>
        <div class="invite">
          <div id="room-qr" class="qr" role="img" aria-label="招待リンクのQRコード"></div>
          <div class="invite-side">
            <p>みんなに番号を伝えるか、<br />カメラでQRを読んでもらおう</p>
            <button id="room-invite" class="btn small">招待リンクを送る</button>
          </div>
        </div>
        <button id="room-mode" class="lobby-mode" type="button"></button>
        <p id="room-count" class="code-label"></p>
        <ul id="room-players" class="players"></ul>
        <button id="room-start" class="btn primary">対戦を始める</button>
        <p id="room-wait" class="msg"></p>
        <button id="room-leave" class="btn">部屋を出る</button>
      </div>
      <p id="room-msg" class="msg" role="status"></p>
    </dialog>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
